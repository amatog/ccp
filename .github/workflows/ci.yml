# Läuft bei jedem Pull Request: Build, Unit-Tests und Playwright gegen eine lokal gestartete App.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build und Unit-Tests
        run: mvn -B verify

      - name: App lokal starten
        run: |
          nohup java -jar target/app.jar --server.port=8080 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat app.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright-Tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Playwright-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr
          path: e2e/playwright-report
          retention-days: 14
