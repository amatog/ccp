# Läuft bei jedem Push auf main: Build -> Deploy auf den Hostinger-VPS -> Playwright gegen den Server -> JIRA-Report.
name: Deploy & Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jira_issue:
        description: 'JIRA-Ticket für den Testreport (z. B. CCP-1), optional'
        required: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_PORT: '8081'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build und Unit-Tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: SSH einrichten
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: JAR hochladen und Dienst neu starten
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp app.jar "$TARGET:/opt/ccp/app.jar.new"
          ssh "$TARGET" 'mv /opt/ccp/app.jar.new /opt/ccp/app.jar && sudo /usr/bin/systemctl restart ccp'

      - name: Warten, bis die App erreichbar ist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for i in $(seq 1 60); do
            curl -fs "http://$VPS_HOST:$APP_PORT/actuator/health" && exit 0
            sleep 3
          done
          echo "App ist nach dem Deployment nicht erreichbar"; exit 1

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright-Browser aus dem Cache holen
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Playwright-Tests gegen den VPS
        id: playwright
        working-directory: e2e
        env:
          BASE_URL: http://${{ secrets.VPS_HOST }}:${{ env.APP_PORT }}
        run: |
          npm ci
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then npx playwright install chromium; fi
          # Systempakete sind auf ubuntu-latest vorhanden; apt nur als Rückfall, falls Chromium nicht startet.
          node -e "require('@playwright/test').chromium.launch().then(b => b.close())" || npx playwright install-deps chromium
          npx playwright test

      - name: Playwright-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 30

      - name: Testresultat nach JIRA melden
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE: ${{ github.event.inputs.jira_issue }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RESULTS_FILE: e2e/test-results/results.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          APP_URL: http://${{ secrets.VPS_HOST }}:${{ env.APP_PORT }}
        run: node scripts/jira-report.mjs
