# Prozessschritt 7: Claude schreibt die Playwright-Tests für einen Codex-PR, führt sie aus und
# committet sie auf den PR-Branch. Danach starten CI und Gemini-Review.
#
# Auslöser: automatisch am Ende von codex-implement.yml, oder manuell über «Run workflow».
# Werkzeuge und Regeln (scripts/, CLAUDE.md, Auftragsvorlage) kommen aus main; der PR-Stand liegt in pr/.
# Einrichtung: docs/CLAUDE-TESTS-SETUP.md
name: Claude – Playwright-Tests schreiben

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Nummer des Pull Requests, z. B. 4'
        required: true
      issue_key:
        description: 'JIRA-Ticket, z. B. CCP-9 (leer = aus dem PR-Titel)'
        required: false
      start_review:
        description: 'Danach Gemini-Review starten'
        type: boolean
        default: true

concurrency:
  group: claude-tests-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write        # Tests auf den PR-Branch pushen
  pull-requests: write   # Zusammenfassung als PR-Kommentar
  issues: write          # PR-Kommentare laufen über die Issues-API
  actions: write         # CI und Gemini-Review starten

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      ISSUE_KEY_INPUT: ${{ inputs.issue_key }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Pull Request ermitteln
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Nur von main aus startbar (gestartet von $GITHUB_REF)."; exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then echo "Ungültige PR-Nummer «$PR_NUMBER»"; exit 1; fi
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          [ "$(jq -r .state "$RUNNER_TEMP/pr.json")" = "open" ] || { echo "PR #$PR_NUMBER ist nicht offen."; exit 1; }
          [ "$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")" = "$REPO" ] || { echo "PR stammt aus einem Fork – abgelehnt."; exit 1; }
          title="$(jq -r .title "$RUNNER_TEMP/pr.json")"
          key="${ISSUE_KEY_INPUT:-$(grep -oE 'CCP-[0-9]+' <<<"$title" | head -1 || true)}"
          [[ "$key" =~ ^CCP-[0-9]+$ ]] || { echo "Kein JIRA-Ticket im PR-Titel «$title»."; exit 1; }
          {
            echo "branch=$(jq -r .head.ref "$RUNNER_TEMP/pr.json")"
            echo "sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "url=$(jq -r .html_url "$RUNNER_TEMP/pr.json")"
            echo "issue_key=$key"
          } >> "$GITHUB_OUTPUT"

      # Vertrauenswürdiger Stand (main): JIRA-Skript, CLAUDE.md und Auftragsvorlage.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Stand des Pull Requests – hier schreibt Claude die Tests.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pr/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pr/e2e/package-lock.json

      - name: Spezifikation und Auftrag bereitlegen
        id: task
        env:
          ISSUE_KEY: ${{ steps.pr.outputs.issue_key }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SPEC_OUT: pr/.claude-task/spec.md
          PROMPT_TEMPLATE: .github/claude/prompts/e2e-tests.md
          PROMPT_OUT: ${{ runner.temp }}/claude-task.md
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          mkdir -p pr/.claude-task
          echo ".claude-task/" >> pr/.git/info/exclude
          node scripts/jira-codex.mjs tests-start

      - name: App aus dem PR-Stand bauen und starten
        working-directory: pr
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/app.jar --server.port=8080 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"; exit 1

      - name: Playwright einrichten
        working-directory: pr/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Claude Code installieren
        run: npm install -g @anthropic-ai/claude-code && claude --version

      # Nur in diesem Schritt ist der Anthropic-Schlüssel gesetzt. Keine GitHub- oder JIRA-Zugangsdaten.
      # --bare: keine Hooks, MCP-Server oder Einstellungen aus dem PR-Stand laden.
      # dontAsk: alles ausser den freigegebenen Werkzeugen wird abgelehnt.
      - name: Claude schreibt die Tests
        id: claude
        working-directory: pr/e2e
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BUDGET: ${{ vars.CLAUDE_MAX_BUDGET_USD || '5' }}
        run: |
          set -o pipefail
          model_args=()
          [ -n "$CLAUDE_MODEL" ] && model_args=(--model "$CLAUDE_MODEL")
          claude --bare -p "$(cat "$RUNNER_TEMP/claude-task.md")" \
            --append-system-prompt-file "$GITHUB_WORKSPACE/CLAUDE.md" \
            --add-dir .. \
            --permission-mode dontAsk \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(npx playwright test *),Bash(npx tsc *)" \
            --max-budget-usd "$BUDGET" \
            --output-format json "${model_args[@]}" > "$RUNNER_TEMP/claude.json" || true
          if ! jq -e . "$RUNNER_TEMP/claude.json" > /dev/null 2>&1; then
            echo "reason=Claude Code lieferte keine auswertbare Antwort." >> "$GITHUB_OUTPUT"; exit 1
          fi
          jq -r '.result // ""' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/claude-summary.md"
          echo "cost=$(jq -r '.total_cost_usd // ""' "$RUNNER_TEMP/claude.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.is_error // false' "$RUNNER_TEMP/claude.json")" = "true" ]; then
            echo "reason=Claude Code meldete einen Fehler: $(head -c 200 "$RUNNER_TEMP/claude-summary.md" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - name: Änderungen prüfen
        id: changes
        working-directory: pr
        run: |
          git add -A
          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "reason=Claude hat keine Testdatei angelegt." >> "$GITHUB_OUTPUT"; exit 1
          fi
          if echo "$changed" | grep -vE '^e2e/tests/[^/]+\.ts$'; then
            echo "reason=Claude hat Dateien ausserhalb von e2e/tests/ geändert." >> "$GITHUB_OUTPUT"; exit 1
          fi
          { echo "files<<CHANGED_EOF"; echo "$changed"; echo "CHANGED_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Geänderte Dateien:"; echo "$changed"

      # Unabhängige Prüfung durch den Workflow, nicht durch Claude.
      - name: Gesamte Playwright-Suite ausführen
        id: run
        working-directory: pr/e2e
        run: |
          npx tsc --noEmit -p .
          npx playwright test || true
          f=test-results/results.json
          [ -f "$f" ] || { echo "reason=Playwright hat keine Resultate geschrieben." >> "$GITHUB_OUTPUT"; exit 1; }
          echo "passed=$(jq '.stats.expected + .stats.flaky' "$f")" >> "$GITHUB_OUTPUT"
          echo "failed=$(jq '.stats.unexpected' "$f")" >> "$GITHUB_OUTPUT"

      - name: Commit und Push auf den PR-Branch
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          ISSUE_KEY: ${{ steps.pr.outputs.issue_key }}
        run: |
          git config user.name "Claude (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$ISSUE_KEY Playwright-Tests (automatisch von Claude)" -m "Lauf: $RUN_URL"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"

      - name: Zusammenfassung am PR veröffentlichen
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ steps.run.outputs.passed }}
          FAILED: ${{ steps.run.outputs.failed }}
        run: |
          body="$RUNNER_TEMP/pr-comment.md"
          if [ -s "$RUNNER_TEMP/claude-summary.md" ]; then cat "$RUNNER_TEMP/claude-summary.md" > "$body"
          else echo "_Claude hat keine Zusammenfassung geliefert._" > "$body"; fi
          printf '\n\n**Kontrolllauf des Workflows:** %s bestanden, %s fehlgeschlagen · Lauf: %s\n\n🤖 Automatisch erstellt von Claude Code über GitHub Actions\n' \
            "$PASSED" "$FAILED" "$RUN_URL" >> "$body"
          url="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body" --jq .html_url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Push mit dem GITHUB_TOKEN löst keine Workflows aus – CI ausdrücklich starten.
      - name: CI für den PR-Branch starten
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"

      - name: Ergebnis in JIRA melden
        env:
          ISSUE_KEY: ${{ steps.pr.outputs.issue_key }}
          PR_URL: ${{ steps.pr.outputs.url }}
          COMMENT_URL: ${{ steps.post.outputs.url }}
          TEST_FILES: ${{ steps.changes.outputs.files }}
          PASSED: ${{ steps.run.outputs.passed }}
          FAILED: ${{ steps.run.outputs.failed }}
          COST_USD: ${{ steps.claude.outputs.cost }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-codex.mjs tests-done

      - name: Fehlschlag in JIRA melden
        if: failure() && steps.pr.outputs.issue_key != ''
        env:
          ISSUE_KEY: ${{ steps.pr.outputs.issue_key }}
          PR_URL: ${{ steps.pr.outputs.url }}
          FAILURE_REASON: ${{ steps.changes.outputs.reason || steps.claude.outputs.reason || steps.run.outputs.reason || '' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-codex.mjs tests-failed

      # Prozessschritt 4: Gemini prüft den PR inklusive Tests – auch wenn die Tests fehlschlagen.
      - name: Gemini-Review starten
        if: always() && inputs.start_review && steps.pr.outputs.issue_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.pr.outputs.issue_key }}
        run: gh workflow run gemini-review.yml --repo "$REPO" --ref main -f pr_number="$PR_NUMBER" -f issue_key="$ISSUE_KEY"
