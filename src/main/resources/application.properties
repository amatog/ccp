spring.application.name=ccp
server.port=8080

# Demo-Passwort für alle fiktiven Kunden (überschreibbar mit CCP_DEMO_PASSWORD)
ccp.demo.password=${CCP_DEMO_PASSWORD:demo1234}

# Nur der Health-Endpunkt ist öffentlich (für Deployment-Checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
